# Override local del servidor (no versionado): construye las imágenes aquí,
# añade MySQL y el túnel de Cloudflare.
# Uso: docker compose --env-file .env.production -f compose.yaml -f compose.server.yaml …
services:
  app:
    build:
      context: ../..
      dockerfile: docker/production/Dockerfile
      target: app
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - app-storage:/var/www/html/storage/app

  nginx:
    build:
      context: ../..
      dockerfile: docker/production/Dockerfile
      target: nginx

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    # Red del host: el túnel en Cloudflare apunta a http://127.0.0.1:8086.
    network_mode: host
    depends_on:
      - nginx

volumes:
  mysql-data:
  app-storage:
