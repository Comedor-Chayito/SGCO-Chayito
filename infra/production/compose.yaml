# Production stack for a VPS or Docker-capable platform. It deliberately does
# not include MySQL: use a managed/private database with backups and recovery.
# Run every command with: docker compose --env-file .env.production -f compose.yaml …
name: sgco-chayito-production

services:
  app:
    image: ${APP_IMAGE:?Set APP_IMAGE to an immutable registry tag or digest}
    env_file: .env.production
    restart: unless-stopped
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - backend
    stop_grace_period: 30s

  nginx:
    image: ${NGINX_IMAGE:?Set NGINX_IMAGE to an immutable registry tag or digest}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${HTTP_PORT:-8080}:8080"
    depends_on:
      - app
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/up || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  queue:
    image: ${APP_IMAGE:?Set APP_IMAGE to an immutable registry tag or digest}
    env_file: .env.production
    command: ["php", "artisan", "queue:work", "redis", "--sleep=3", "--tries=3", "--max-time=3600"]
    restart: unless-stopped
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - backend
    stop_grace_period: 90s

  scheduler:
    image: ${APP_IMAGE:?Set APP_IMAGE to an immutable registry tag or digest}
    env_file: .env.production
    command: ["php", "artisan", "schedule:work"]
    restart: unless-stopped
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - backend
    stop_grace_period: 30s

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    restart: unless-stopped
    volumes:
      - redis-data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

networks:
  backend:
    driver: bridge

volumes:
  redis-data:
